  <!DOCTYPE html>
  <html>
    <head>
      <style>
	@font-face {
	  font-family: BebasNeue;
	    src: url(BebasNeue-Regular.ttf);	      

	}
	@font-face {
	    font-family: Permanent Marker;
	    src: url(PermanentMarker-Regular.ttf);	      
	}
	body {
	  margin: 0;	
          width: 300px;
	  height: 510px;
	  background-image: url('./images/cover_20241118.png');
        }
	#wrapper {		
		margin: 10px;
	}
	#title-ext {
	height: 200px;
	margin: 0px 0 10px 0;
	font-size: 65px;
	  text-shadow: 2px 4px #ad7400;
	  text-align: center;
	font-family: Permanent Marker;
	display:none;
	}
	#empty-space1 {
	height: 110px;
	}  
	#rating {
	  color: #383838;
    text-decoration: none;
    background-image: url('./images/cover_t1_20241118.png');
    display: block;
    width: 192px;
    height: 40px;
    margin-left: 40px;
    margin-bottom: 40px;
	}
	#rating h4:active {
	}

	#rating h4 {
      	  margin: 10px 0 0 0;
	  text-align: center;
    
    display: none;
	}
	#icons {
          width: 100%;
	  padding: 6px;
	}
        button {
          height: 32px;
          width: 32px;
          outline: none;
          padding: 3px;
          border: none;
        }
        .buttonDiv :hover {
          cursor: pointer;
        }
	@keyframes slidein {
 	  }
	@keyframes luminate {
	  from {
		border: 1px dashed #573a00;
	  }
	  13% {
		border: 1px  dashed #573a00;
	  }
	  to {
		border: 1px dashed #573a00;
	  }
	}
	:root {
	  --white-red: #ff8282;
	}
	@keyframes rainbow {
	  from {
	    background-color: #ff8282;
	  }
	  50% {
	    background-color: #ff82d9;
	  }
	  to {
	    background-color: #ff8282;
	  }
	}
        h4 {
	  padding: 10px 0 10px 0;
          font-size: 0.9rem;
	  color: #573a00;
	  font-family: BebasNeue;
          text-indent: 10px;
          background-color: #ffa05c;
	  font-weight: 100;
          animation-duration: 3s;
          animation-name: slidein;
        }
	h4:hover {
  text-decoration: underline;
	}
	
        .buttonDiv {
          margin: 5px;
          padding: 0px;
	  height: 20px;
	  display: inline-block;
        }
	.mousemove {
	  border-radius: 50%;
	  border: 1px;
    background-color: #cca813;
	  animation-duration: 2s;
          animation-name: slidein;

	}
	.mousemove:hover {
 	  animation-duration: 3s;
  	  animation-iteration-count: infinite;
          animation-name: luminate;

/*  	    box-shadow: 0.3rem 0.3rem 1rem #00ff37, -0.2rem -0.2rem 0.5rem #FFFFFF;
	    */
	}
	.mousemove:active {
          box-shadow:0;
	  transform: scale(0.95, 0.95);
	  animation-iteration-count: 0;
	}
        .test {
          display: none; 
        }
        #bubble {
          background-image: url('./images/bubble/bubble32.png');
        }
        #letter {
          background-image: url('./images/letter/letter32.png');
        }
        #colorfulSquare {
          background-image: url('./images/csquare/colofulSquare32.png');
        }
        #colorfulBall {
          background-image: url('./images/co/colofulBall32.png');
        }
        #strawblueberry {
          background-image: url('./images/strawblueberry/strawblueberry32.png');
        }
        #snowflake {
          background-image: url('./images/snow/snowflake32.png');
        }
	#bunny {
          background-image: url('./images/bunny/bunny32.png');
        }
        #waterWave {
          background-image: url('./images/snow/snowflake32.png');
        }
        #heart {
          background-image: url('./images/heart/heart32.png');
        }
        #heart1 {
          background-image: url('./images/heart/heart132.png');
        }
        #leaf {
          background-image: url('./images/leaf/leaf32.png');
        }
        #dna {
          background-image: url('./images/dna/dna32.png');
        }
        #card {
          background-image: url('./images/card/card32.png');
        }
        #atom {
          background-image: url('./images/atom/atom32.png');
        }
        #petal {
          background-image: url('./images/petal/petal32.png');
	  background-color: white;
        }      
        #float {
          background-image: url('./images/dna/float32.png');
        }        
        #springCooler {
          background-image: url('./images/spring/springCooler32.png');
        }
        #colorSpring {
          background-image: url('./images/colorSpring/colorSpring32.png');
        }
	#coins {
          background-image: url('./images/coins/coins32');
        }
	#digital {
          background-image: url('./images/digital/digital32');
        }
	#particleMagnet {
          background-image: url('./images/particleMagnet/particleMagnet32');
        }
	#rainbow {
          background-image: url('./images/rainbow/rainbow32');
	  background-color: white;
        }
	#warpWhite {
          background-image: url('./images/warpWhite/warpWhite32');
	  background-color: #ec9d75;
        }
	#warpBlack {
          background-image: url('./images/warpBlack/warpBlack32');
	  background-color: #ec9d75;
        }
	#warpRainbow {
          background-image: url('./images/rainbow/rainbow32');
	  background-color: #ec9d75;
        }
	
  .stopButton {    
  }

  .on {
    background-image: url('./images/cover_t2_20241118.png');  
  }

  .off {
    background-image: url('./images/cover_t3_20241118.png');    
  }

	#stop {
    display: block;
    cursor: pointer;		
    width: 140px;    
    color: #481710;
    font-size: 1px;
    height: 40px;
    margin-left: 75px;    
    margin-top: 20px;
	}

	#stop:active {
	}
	#stop:hover {      
	}
	
      </style>
